name: Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "schedule-api/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: schedule-api

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 권한 부여
        run: chmod +x ./gradlew

      - name: Gradle 빌드
        run: ./gradlew build

      - name: Docker 로그인
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker 이미지 빌드
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/schedule-backend:latest .

      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/schedule-backend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 서버 배포 SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "🚀 배포 시작"

            cd /home/admin/app

            echo "📌 Docker 로그인"
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "📌 환경변수 파일 생성"
            cat > .env <<EOF
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_NAME=${{ secrets.DB_NAME }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
            APP_AUTH_JWT_SECRET=${{ secrets.APP_AUTH_JWT_SECRET }}
            APP_AUTH_KAKAO_CLIENT_ID=${{ secrets.APP_AUTH_KAKAO_CLIENT_ID }}
            APP_AUTH_KAKAO_REDIRECT_URI=${{ secrets.APP_AUTH_KAKAO_REDIRECT_URI }}
            APP_FCM_ENABLED=true
            APP_FCM_CREDENTIALS_PATH=/app/firebase/firebase-adminsdk.json
            EOF

            echo "📌 기존 수동 실행 backend 컨테이너 정리"

            COMPOSE_PROJECT=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' backend 2>/dev/null || true)

            if [ -z "$COMPOSE_PROJECT" ]; then
              docker rm -f backend 2>/dev/null || true
            fi

            echo "📌 최신 backend 이미지 pull"
            docker compose pull backend

            echo "📌 docker compose로 서비스 반영"
            docker compose up -d --remove-orphans

            echo "📌 Nginx 설정 검증"
            docker compose exec -T nginx nginx -t

            echo "📌 컨테이너 상태 확인"
            docker compose ps

            echo "📌 backend 로그 확인"
            docker compose logs --tail=100 backend

            echo "📌 nginx 로그 확인"
            docker compose logs --tail=100 nginx

            echo "✅ 배포 완료"
